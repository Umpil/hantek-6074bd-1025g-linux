[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hantek-linux"
version = "0.1.0"
description = "Native Linux USB bring-up for Hantek1025G and Hantek6000B"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.3.1,<2"] # System libusb supplies the native backend.

[project.optional-dependencies]
web = ["flask>=3,<4"] # webui/ browser front end

[project.scripts]
hantek-linux = "hantek_linux.cli:main"

[tool.setuptools.packages.find]
include = ["hantek_linux*"]
